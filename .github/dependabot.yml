# Dependabot — weekly Cargo updates and GitHub Actions updates (OI-20).
#
# This replaces part of OI-13 (cargo-audit / cargo-deny pre-release) with
# the native tool: security alerts and version updates without a local
# scanner. Alert settings live in the repository settings, not in this file.
#
# One PR per ecosystem, grouped: a weekly PR with all minor/patch Cargo
# updates, plus one for the GitHub Actions used by the workflow.
#
# `rand_chacha` and `rand_core` 0.10 are ignored. The major bump changes
# the `ChaCha20Rng` API (`from_seed`, `next_u32`, `fill_bytes`), which is
# the deterministic RNG core (`ds-core/src/rng.rs`,
# `ds-db/src/latents.rs`). A breaking change there is a
# `SIM_VERSION` decision, not a dependency bump. Verified locally on
# 2026-11-01: `cargo clippy` fails on both 0.10 branches. Remove the
# ignore when the RNG migration has its own session.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "rand_chacha"
        versions: ["0.10.x"]
      - dependency-name: "rand_core"
        versions: ["0.10.x"]
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
