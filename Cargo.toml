# Cargo.toml — PCFM workspace root

[workspace]
resolver = "3"
members = [
    "crates/ds-core",
    "crates/ds-model",
    "crates/ds-db",
    "crates/ds-orchestrator",
    "crates/ds-match",
    "crates/ds-stats",
    "crates/ds-test-runner",
    "crates/ds-demo",
    "crates/ds-fixtures",
    "crates/ds-testkit",   # ← NUOVO
    "crates/ds-calculator",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["PC Football Manager Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/liraan/calciovero"
homepage = "https://github.com/liraan/calciovero"
documentation = "https://github.com/liraan/calciovero/tree/main/modules"

[workspace.dependencies]
# Internal
ds-core = { path = "crates/ds-core", version = "0.1.0" }
ds-model = { path = "crates/ds-model", version = "0.1.0" }
ds-db = { path = "crates/ds-db", version = "0.1.0" }
ds-orchestrator = { path = "crates/ds-orchestrator", version = "0.1.0" }
ds-stats = { path = "crates/ds-stats", version = "0.1.0" }
ds-match = { path = "crates/ds-match", version = "0.1.0" }
ds-test-runner = { path = "crates/ds-test-runner", version = "0.1.0" }
ds-testkit = { path = "crates/ds-testkit", version = "0.1.0" }
ds-fixtures = { path = "crates/ds-fixtures", version = "0.1.0" }
ds-calculator = { path = "crates/ds-calculator", version = "0.1.0" }
# RNG
rand_chacha = "0.9"
rand_core = "0.9"
blake3 = "1"
# Errors and serialisation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
correctness = "deny"
suspicious = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"
