# Cargo.toml — Calcio Vero - Deep Simulator workspace root

[workspace]
resolver = "3"
members = [
    "L0-match/crates/ds-core",
    "L0-match/crates/ds-model",
    "L0-match/crates/ds-db",
    "L0-match/crates/ds-orchestrator",
    "L0-match/crates/ds-match",
    "L0-match/crates/ds-stats",
    "tools/ds-test-runner",
    "tools/ds-demo",
    "tools/ds-gui",
    "tools/ds-fixtures",
    "tools/ds-testkit",   # ← NUOVO
    "tools/ds-reference",
    "L0-match/crates/ds-calculator",
    "L0-match/crates/ds-match-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["PC Football Manager Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/liraan/calciovero"
homepage = "https://github.com/liraan/calciovero"
documentation = "https://github.com/liraan/calciovero/tree/main/modules"

[workspace.dependencies]
# Internal
ds-core = { path = "L0-match/crates/ds-core", version = "0.1.0" }
ds-model = { path = "L0-match/crates/ds-model", version = "0.1.0" }
ds-db = { path = "L0-match/crates/ds-db", version = "0.1.0" }
ds-orchestrator = { path = "L0-match/crates/ds-orchestrator", version = "0.1.0" }
ds-stats = { path = "L0-match/crates/ds-stats", version = "0.1.0" }
ds-match = { path = "L0-match/crates/ds-match", version = "0.1.0" }
ds-test-runner = { path = "tools/ds-test-runner", version = "0.1.0" }
ds-testkit = { path = "tools/ds-testkit", version = "0.1.0" }
ds-fixtures = { path = "tools/ds-fixtures", version = "0.1.0" }
ds-calculator = { path = "L0-match/crates/ds-calculator", version = "0.1.0" }
ds-match-api = { path = "L0-match/crates/ds-match-api", version = "0.1.0" }
# RNG
rand_chacha = "0.9"
rand_core = "0.9"
blake3 = "1"
# Deterministic math (ds_core::dmath): pure Rust, the same bits on every
# target. Pinned exactly: another version may round differently.
libm = "=0.2.16"
# Errors and serialisation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
correctness = "deny"
suspicious = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"

# Tests play whole matches; unoptimised, the suite takes over twenty
# minutes and every commit waits for it (the pre-commit hook). Opt-level 1
# changes no result: the simulation's arithmetic is IEEE and deterministic
# (`ds_core::dmath`, no fast-math), and the goldens pass the same in debug
# and release (2026-11-15).
[profile.dev]
opt-level = 1
