[package]
name = "ds-gui-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Android GUI (A portrait / C landscape) for Calcio Vero."

[lib]
name = "ds_gui_android"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ds-gui-android-preview"
path = "src/main.rs"

[dependencies]
ds-career = { path = "../../L1-season/crates/ds-career" }
ds-world = { path = "../../L1-season/crates/ds-world" }
eframe = { version = "=0.32.3", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
egui = "=0.32.3"
winit = "=0.30.13"

[package.metadata.android]
package = "com.calciovero.game"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Calcio Vero"

[lints]
workspace = true
