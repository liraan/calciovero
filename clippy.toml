# clippy.toml — workspace lints configuration (gate C2: clippy -D warnings).
#
# Determinism on every platform (SIM_VERSION 101, ds_core::dmath): the
# transcendental functions of std call the C library of the system, and
# glibc, its versions, the Windows CRT and macOS round the last bit each
# their own way (std hypot alone made seed 42 end 2-2 with glibc, 3-5 with
# musl). Use ds_core::dmath; a function missing there enters with its
# first consumer, from the `libm` crate. sqrt and mul_add are correctly
# rounded by IEEE 754 and stay.

disallowed-methods = [
    { path = "f64::hypot", reason = "platform-dependent bits: use ds_core::dmath (SIM_VERSION 101)" },
    { path = "f64::atan2", reason = "platform-dependent bits: use ds_core::dmath (SIM_VERSION 101)" },
    { path = "f64::sin", reason = "platform-dependent bits: use ds_core::dmath (SIM_VERSION 101)" },
    { path = "f64::cos", reason = "platform-dependent bits: use ds_core::dmath (SIM_VERSION 101)" },
    { path = "f64::tan", reason = "platform-dependent bits: use ds_core::dmath (SIM_VERSION 101)" },
    { path = "f64::sin_cos", reason = "platform-dependent bits: use ds_core::dmath (SIM_VERSION 101)" },
    { path = "f64::asin", reason = "platform-dependent bits: use ds_core::dmath (SIM_VERSION 101)" },
    { path = "f64::acos", reason = "platform-dependent bits: use ds_core::dmath (SIM_VERSION 101)" },
    { path = "f64::atan", reason = "platform-dependent bits: use ds_core::dmath (SIM_VERSION 101)" },
    { path = "f64::sinh", reason = "platform-dependent bits: use ds_core::dmath (SIM_VERSION 101)" },
    { path = "f64::cosh", reason = "platform-dependent bits: use ds_core::dmath (SIM_VERSION 101)" },
    { path = "f64::tanh", reason = "platform-dependent bits: use ds_core::dmath (SIM_VERSION 101)" },
