# .cargo/config.toml — Cargo configuration for the workspace.
#
# Intentionally minimal. Add only what is needed, and document why.
#
# The C2 quality gate is NOT a raw `cargo test`: it is `session.sh`, the single
# source of truth (context/RULES.md §C2). Run `bash context/scripts/session.sh
# check changed` while iterating and `bash context/scripts/session.sh close`
# before committing. That script owns:
#   - the guard map (which test functions cover a changed source file);
#   - no time limit on tests: a deadline killed a green check mid-compile (2026-11-21);
#   - the result cache in .cache/session-tests/ (gitignored): a file whose
#     content hash was already verified, under the same guard map, is not
#     retested. A changed file, a changed guard map or no cache runs the tests.
# `close` disables the cache so that a `Verified: C2-green` trailer stays true
# (D1: the gate must have actually run in that session).
#
# Future entries (uncomment when needed):
#
# [alias]
# check-all = "check --workspace --all-targets --all-features"
# test-all  = "test --workspace --all-targets --all-features"
# clippy-all = "clippy --workspace --all-targets --all-features -- -D warnings"
#
# [build]
# rustflags = ["-D", "warnings"]   # in CI only, not in local development
